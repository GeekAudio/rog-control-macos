name: 构建检查

# 每次推送 main、提交 PR 或手动触发时，编译两个内核扩展、菜单栏应用、Fn 键守护进程与 CPU 策略守护进程，
# 跑一遍风扇曲线解码测试，并打出 DMG 与各组件 zip 作为临时产物（保留 7 天，不发布）。
# 正式发布见 release.yml。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译并测试
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示工具链版本
        run: |
          sw_vers
          swiftc --version
          xcodebuild -version || true

      - name: 编译内核扩展（AsusWmi、AmdCppc）
        run: bash scripts/build.sh

      - name: 风扇曲线解码测试
        run: bash scripts/test-rogcontrol.sh

      - name: 编译应用、Fn 键守护进程与 CPU 策略守护进程
        run: |
          bash scripts/build-rogcontrol.sh
          bash scripts/build-rogkeys.sh
          bash scripts/build-amdcppc-policy.sh

      - name: 打包 DMG 与组件压缩包
        run: bash scripts/package.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: rog-control-cn-${{ github.sha }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error
